# DBY-W09: CPU kHz, GPU Hz. Only CPU governor and frequency bounds.
# No inherited tuning; schedutil remains in control in all three profiles.

[main]
summary=DBY-W09 balanced CPU and GPU limits

[cpu]
governor=schedutil

[sysfs]
/sys/class/devfreq/3d00000.gpu/governor=simple_ondemand
# Lower minima before capping maxima; otherwise widen maxima before minima.
# All supported profile intervals overlap, so rollback order is safe too.
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=1804800
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=300000
/sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq=2419200
/sys/devices/system/cpu/cpufreq/policy4/scaling_min_freq=710400
/sys/devices/system/cpu/cpufreq/policy7/scaling_max_freq=2841600
/sys/devices/system/cpu/cpufreq/policy7/scaling_min_freq=844800
/sys/class/devfreq/3d00000.gpu/max_freq=587000000
/sys/class/devfreq/3d00000.gpu/min_freq=305000000
