# Applies only when no program holds the handle-power-key inhibitor.
# GNOME's gsd-media-keys holds it; the session helper handles the key there.
# Without an inhibitor, a short press no longer powers off; a long press does.
# The hold duration is built into logind, not configured here (device timing U).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
