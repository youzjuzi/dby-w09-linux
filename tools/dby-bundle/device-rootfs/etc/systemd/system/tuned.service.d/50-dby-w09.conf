# The device initramfs copies etc/ payloads into /run before systemd starts.
# Bind configuration only; active_profile/profile_mode stay writable on p2.
[Service]
# cpufreq's OSM L3 provider is built in; GPU devfreq still needs msm.
# Keep both readiness checks: tuned skips absent paths.
# Wait up to 200 x 0.1 s, then start anyway (safe mode has no GPU).
ExecStartPre=/bin/sh -c 'attempt=0; while [ "$$attempt" -lt 200 ]; do if [ -e /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq ] && [ -e /sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq ] && [ -e /sys/devices/system/cpu/cpufreq/policy7/scaling_max_freq ] && [ -e /sys/class/devfreq/3d00000.gpu/max_freq ]; then exit 0; fi; sleep 0.1; attempt=$$((attempt + 1)); done; exit 0'
BindReadOnlyPaths=/run/tuned/profiles:/etc/tuned/profiles
BindReadOnlyPaths=/run/tuned/recommend.conf:/etc/tuned/recommend.conf
