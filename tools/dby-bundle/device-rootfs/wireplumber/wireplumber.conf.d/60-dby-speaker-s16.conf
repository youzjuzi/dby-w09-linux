# DBY-W09: force the onboard speaker node to S16LE.
# Measured on this device: the S24_LE front-end path plays about 48 dB too quiet.
monitor.alsa.rules = [
  { matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = { update-props = { audio.format = "S16LE" } } }
]
